<!DOCTYPE html>
<html>
<head>
  <title>DyslexiQuest v1 - No Emojis</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600;700;800&family=Roboto:wght@400;500;700&display=swap');
    
    body { 
      font-family: 'Open Sans', 'Roboto', Arial, sans-serif !important; 
      font-weight: 600; 
      background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 50%, #fecfef 100%);
      margin: 0; padding: 20px; 
      color: #333;
      user-select: none;
      line-height: 1.5;
      letter-spacing: 0.5px;
    }

    * {
      font-family: 'Open Sans', 'Roboto', Arial, sans-serif !important;
    }

    .game-container {
      max-width: 1200px;
      margin: 0 auto;
      text-align: center;
    }

    h1 {
      font-family: 'Open Sans', 'Roboto', Arial, sans-serif !important;
      font-size: 3em;
      margin-bottom: 20px;
      background: linear-gradient(45deg, #667eea, #764ba2);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      font-weight: 800;
    }

    .stats {
      display: flex;
      justify-content: center;
      gap: 30px;
      margin: 20px 0;
      font-size: 1.4em;
      font-weight: 800;
    }

    .stat {
      background: rgba(255,255,255,0.3);
      padding: 10px 25px;
      border-radius: 25px;
      min-width: 80px;
    }

    #word-prompt {
      font-family: 'Open Sans', 'Roboto', Arial, sans-serif !important;
      font-size: 2.2em;
      background: rgba(255,255,255,0.9);
      padding: 25px 40px;
      border-radius: 30px;
      margin: 30px 0;
      font-weight: 900;
      color: #444;
      box-shadow: 0 10px 30px rgba(0,0,0,0.2);
      line-height: 1.3;
    }

    .controls {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 15px;
      margin: 30px 0;
    }

    button { 
      font-family: 'Open Sans', 'Roboto', Arial, sans-serif !important;
      padding: 20px 30px; 
      font-size: 1.2em; 
      font-weight: 700;
      min-width: 200px; 
      min-height: 70px; 
      border-radius: 30px;
      border: none; 
      cursor: pointer; 
      white-space: nowrap;
      background: linear-gradient(45deg, #4ecdc4, #44a08d); 
      color: white;
      transition: all 0.3s ease;
      box-shadow: 0 8px 25px rgba(0,0,0,0.2);
      line-height: 1.4;
    }

    button:hover {
      transform: translateY(-3px);
      box-shadow: 0 12px 35px rgba(0,0,0,0.3);
    }

    button:active {
      transform: translateY(-1px);
    }

    .language-btn.active {
      background: linear-gradient(45deg, #667eea, #764ba2);
    }

    .speak-btn {
      background: linear-gradient(45deg, #f093fb, #f5576c) !important;
      font-size: 1.3em;
    }

    .collection-btn {
      background: linear-gradient(45deg, #f39c12, #e67e22) !important;
      animation: pulse 2s infinite;
    }

    @keyframes pulse {
      0% { box-shadow: 0 0 0 0 rgba(243, 156, 18, 0.7); }
      70% { box-shadow: 0 0 0 20px rgba(243, 156, 18, 0); }
      100% { box-shadow: 0 0 0 0 rgba(243, 156, 18, 0); }
    }

    .game-area {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 20px;
      margin: 40px 0;
      padding: 30px;
    }

    .card { 
      width: 240px; 
      height: 300px; 
      margin: 10px;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      border-radius: 30px; 
      cursor: pointer; 
      display: flex; 
      flex-direction: column;
      align-items: center; 
      justify-content: center; 
      padding: 30px;
      transition: all 0.4s cubic-bezier(0.25, 0.46, 0.45, 0.94);
      box-shadow: 0 15px 35px rgba(0,0,0,0.2);
      position: relative;
      overflow: hidden;
    }

    .card:hover {
      transform: translateY(-10px) scale(1.02);
    }

    .card.target-card { 
      box-shadow: 0 0 40px #4ecdc4, 0 0 80px #4ecdc4; 
      border: 5px solid #4ecdc4; 
      transform: scale(1.05);
      background: linear-gradient(135deg, #4ecdc4, #44a08d);
    }

    .shape-svg { 
      width: 140px; 
      height: 140px; 
      margin-bottom: 15px;
      opacity: 0.85;
      filter: drop-shadow(0 8px 20px rgba(0,0,0,0.3));
    }

    .shape-svg path {
      fill: none;
      stroke: white; 
      stroke-width: 8; 
      stroke-linecap: round;
      stroke-linejoin: round;
      stroke-miterlimit: 10;
      filter: drop-shadow(0 2px 4px rgba(0,0,0,0.2));
    }

    .card-word { 
      font-family: 'Open Sans', 'Roboto', Arial, sans-serif !important;
      font-size: 2.4em; 
      color: white; 
      font-weight: 900; 
      text-shadow: 3px 3px 8px rgba(0,0,0,0.7);
      letter-spacing: 1.5px;
      line-height: 1.2;
    }

    .feedback {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      font-family: 'Open Sans', 'Roboto', Arial, sans-serif !important;
      font-size: 3em;
      font-weight: 900;
      pointer-events: none;
      z-index: 10;
      opacity: 0;
      transition: all 0.5s ease;
    }

    .feedback.correct {
      color: #4ecdc4;
      animation: correctPulse 1s ease-out;
    }

    .feedback.wrong {
      color: #f093fb;
      animation: wrongShake 0.6s ease-out;
    }

    @keyframes correctPulse {
      0% { transform: translate(-50%, -50%) scale(0); opacity: 1; }
      50% { transform: translate(-50%, -50%) scale(1.3); }
      100% { transform: translate(-50%, -50%) scale(1); opacity: 0; }
    }

    @keyframes wrongShake {
      0%, 100% { transform: translate(-50%, -50%) rotate(0deg); }
      25% { transform: translate(-50%, -50%) rotate(-5deg); }
      75% { transform: translate(-50%, -50%) rotate(5deg); }
    }

    .particles {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      overflow: hidden;
    }

    .particle {
      position: absolute;
      width: 10px;
      height: 10px;
      background: #4ecdc4;
      border-radius: 50%;
      pointer-events: none;
      animation: particleFloat 1.5s ease-out forwards;
      box-shadow: 0 2px 6px rgba(0,0,0,0.3);
    }

    @keyframes particleFloat {
      0% { opacity: 1; transform: translateY(0) scale(1); }
      100% { opacity: 0; transform: translateY(-100px) scale(0); }
    }

    .unlock-screen {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: linear-gradient(135deg, #ff6b6b 0%, #feca57 50%, #ff9ff3 100%);
      z-index: 3000;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .unlock-content {
      background: rgba(255,255,255,0.98);
      padding: 60px;
      border-radius: 40px;
      color: #333;
      text-align: center;
      max-width: 700px;
      max-height: 85vh;
      overflow-y: auto;
      box-shadow: 0 40px 100px rgba(0,0,0,0.5);
      animation: unlockSlide 1.2s cubic-bezier(0.25, 0.46, 0.45, 0.94);
      border: 8px solid;
    }

    @keyframes unlockSlide {
      0% { 
        transform: translateY(100px) scale(0.7); 
        opacity: 0; 
      }
      50% { 
        transform: translateY(-20px) scale(1.05); 
      }
      100% { 
        transform: translateY(0) scale(1); 
        opacity: 1; 
      }
    }

    .unlock-animal-container {
      width: 300px;
      height: 300px;
      margin: 30px auto;
      perspective: 1200px;
    }

    .unlock-animal-model {
      width: 100%;
      height: 100%;
      border-radius: 25px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.3);
    }

    .unlock-title {
      font-family: 'Open Sans', 'Roboto', Arial, sans-serif !important;
      font-size: 3.5em;
      margin-bottom: 20px;
      background: linear-gradient(45deg, #667eea, #764ba2);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      font-weight: 800;
    }

    .rarity-display {
      font-family: 'Open Sans', 'Roboto', Arial, sans-serif !important;
      font-size: 4em;
      font-weight: 900;
      margin: 20px 0;
      padding: 20px 40px;
      border-radius: 30px;
      text-shadow: 3px 3px 6px rgba(0,0,0,0.3);
      animation: rarityGlow 2s ease-in-out infinite alternate;
      line-height: 1.1;
    }

    .rarity-common { 
      background: linear-gradient(135deg, #98d8c8, #a8e6cf); 
      color: #2d7749; 
      border: 4px solid #98d8c8;
    }
    .rarity-uncommon { 
      background: linear-gradient(135deg, #5dade2, #85c1e9); 
      color: #2e5a7a; 
      border: 4px solid #5dade2;
    }
    .rarity-rare { 
      background: linear-gradient(135deg, #f39c12, #f1c40f); 
      color: #7f3300; 
      border: 4px solid #f39c12;
    }
    .rarity-epic { 
      background: linear-gradient(135deg, #9b59b6, #bb8fce); 
      color: #4a235a; 
      border: 4px solid #9b59b6;
    }
    .rarity-legendary { 
      background: linear-gradient(135deg, #f1c40f, #f39c12); 
      color: #7f3300; 
      border: 4px solid #f1c40f;
      box-shadow: 0 0 60px #f1c40f;
      animation: legendaryPulse 1.5s ease-in-out infinite alternate;
    }

    @keyframes rarityGlow {
      from { filter: drop-shadow(0 0 10px currentColor); }
      to { filter: drop-shadow(0 0 25px currentColor); }
    }

    @keyframes legendaryPulse {
      from { 
        filter: drop-shadow(0 0 20px #f1c40f); 
        transform: scale(1);
      }
      to { 
        filter: drop-shadow(0 0 40px #f1c40f); 
        transform: scale(1.05);
      }
    }

    .unlock-message {
      font-family: 'Open Sans', 'Roboto', Arial, sans-serif !important;
      font-size: 1.8em;
      margin: 30px 0;
      color: #4ecdc4;
    }

    .unlock-btn {
      padding: 25px 50px;
      font-size: 1.5em;
      margin-top: 30px;
    }

    .modal {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0,0,0,0.8);
      z-index: 1000;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .modal-content {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      padding: 60px;
      border-radius: 40px;
      color: white;
      text-align: center;
      max-width: 500px;
      box-shadow: 0 30px 80px rgba(0,0,0,0.6);
    }

    .modal-progress {
      width: 300px;
      height: 20px;
      background: rgba(255,255,255,0.3);
      border-radius: 10px;
      margin: 20px auto;
      overflow: hidden;
    }

    .modal-progress-fill {
      height: 100%;
      background: linear-gradient(90deg, #4ecdc4, #44a08d);
      width: 0%;
      transition: width 1s ease-out;
    }

    .collection-screen {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
      z-index: 2000;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .collection-content {
      background: rgba(255,255,255,0.95);
      padding: 60px;
      border-radius: 40px;
      color: #333;
      text-align: center;
      max-width: 800px;
      max-height: 80vh;
      overflow-y: auto;
      box-shadow: 0 30px 80px rgba(0,0,0,0.6);
      border: 8px solid;
    }

    .collection-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 20px;
      margin: 30px 0;
      max-height: 400px;
      overflow-y: auto;
    }

    .collection-card {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      border-radius: 20px;
      padding: 20px;
      color: white;
      position: relative;
    }

    .collection-card.locked {
      background: linear-gradient(135deg, #95a5a6 0%, #7f8c8d 100%);
      filter: grayscale(100%);
    }

    .rarity-common { border-color: #98d8c8; }
    .rarity-uncommon { border-color: #5dade2; }
    .rarity-rare { border-color: #f39c12; }
    .rarity-epic { border-color: #9b59b6; }
    .rarity-legendary { border-color: #f1c40f; box-shadow: 0 0 50px #f1c40f; }

    .collection-animal-container {
      width: 120px;
      height: 120px;
      margin: 0 auto 15px;
    }

    .collection-animal {
      width: 100%;
      height: 100%;
    }

    @media (max-width: 700px) { 
      button {min-width:180px; font-size: 1.1em; padding: 18px 25px;}
      .card {width:200px;height:260px; padding: 25px;}
      .shape-svg {width: 120px; height: 120px;}
      .shape-svg path {stroke-width: 6;}
      .card-word {font-size: 2em;}
      h1 {font-size: 2.5em;}
      .stats {font-size: 1.2em; gap: 20px;}
      .controls {flex-direction: column; align-items: center;}
      .unlock-content, .collection-content, .modal-content {padding: 30px; margin: 10px;}
      .unlock-animal-container {width: 250px; height: 250px;}
      .unlock-title {font-size: 2.8em;}
      .rarity-display {font-size: 3em;}
    }
  </style>
</head>
<body>
  <div class="game-container">
    <h1>DyslexiQuest</h1>
    <div class="stats">
      <div class="stat">Level <span id="level">1</span></div>
      <div class="stat">Score <span id="score">0</span></div>
      <div class="stat">Streak <span id="streak">0</span></div>
      <div class="stat">XP <span id="xp">0</span>/<span id="max-xp">100</span></div>
    </div>
    <div id="word-prompt">Listen for: CAT</div>
    <div class="controls">
      <button id="new-game">New Game</button>
      <button id="flash-cards-btn">Flash Cards</button>
      <button id="collection-btn" class="collection-btn">My Collection (<span id="collection-count">0</span>)</button>
      <button id="english-btn" class="language-btn active">English</button>
      <button id="french-btn" class="language-btn">French</button>
      <button id="speak-btn" class="speak-btn">SPEAK WORD</button>
    </div>
    <div id="unlock-message" class="unlock-message" style="display: none;"></div>
    <div id="game-area" class="game-area"></div>
  </div>
  
  <div id="level-up-modal" class="modal">
    <div class="modal-content">
      <h2>LEVEL UP!</h2>
      <p>You reached Level <span id="new-level">2</span>!</p>
      <div class="modal-progress">
        <div class="modal-progress-fill" id="modal-progress-fill"></div>
      </div>
      <button id="continue-btn" class="unlock-btn">Continue Adventure!</button>
    </div>
  </div>

  <div id="unlock-screen" class="unlock-screen">
    <div id="unlock-content" class="unlock-content">
    </div>
  </div>

  <div id="animal-collection-screen" class="collection-screen">
    <div id="collection-content" class="collection-content">
    </div>
  </div>

  <script>
    const words = {
      en: [
        {word: 'cat', shape: 'M50,100 Q80,60 110,100 T170,100 M90,120 Q100,140 110,120'},
        {word: 'dog', shape: 'M40,90 Q70,50 100,90 T160,90 M80,110 Q95,130 110,110'},
        {word: 'hat', shape: 'M60,80 L100,40 L140,80 M70,100 Q100,120 130,100'},
        {word: 'bat', shape: 'M50,70 Q80,40 110,70 T150,70 M60,90 L110,110 L160,90'},
        {word: 'rat', shape: 'M60,80 Q90,50 120,80 T160,80 M80,100 Q110,120 140,100'}
      ],
      fr: [
        {word: 'chat', shape: 'M50,100 Q80,60 110,100 T170,100 M90,120 Q105,135 120,125'},
        {word: 'chien', shape: 'M40,90 Q70,50 100,90 T160,90 M80,110 Q95,130 110,110'},
        {word: 'chapeau', shape: 'M60,80 L100,40 L140,80 M70,100 Q100,120 130,100'},
        {word: 'grande', shape: 'M50,70 Q85,40 120,70 T155,70 M60,90 L110,110 L160,90'},
        {word: 'petit', shape: 'M60,80 Q90,50 120,80 T160,80 M80,100 Q110,120 140,100'}
      ]
    };

    const uniqueAnimals3D = [
      null,
      {name: 'Floating Astronaut Cat', model: 'https://modelviewer.dev/shared-assets/models/Astronaut.glb', color: '#ff9a9e', rarity: 'Common'},
      {name: 'Pink Standing Flamingo Dog', model: 'https://modelviewer.dev/shared-assets/models/Flamingo.glb', color: '#ffd93d', rarity: 'Common'},
      {name: 'Ancient Nefertiti Bunny', model: 'https://modelviewer.dev/shared-assets/models/Nefertiti.glb', color: '#f8f1f1', rarity: 'Uncommon'},
      {name: 'Space Astronaut Fox', model: 'https://modelviewer.dev/shared-assets/models/Astronaut.glb', color: '#ff6b6b', rarity: 'Uncommon'},
      {name: 'Elegant Flamingo Bird', model: 'https://modelviewer.dev/shared-assets/models/Flamingo.glb', color: '#4ecdc4', rarity: 'Uncommon'},
      {name: 'Mysterious Nefertiti Panda', model: 'https://modelviewer.dev/shared-assets/models/Nefertiti.glb', color: '#000000', rarity: 'Rare'},
      {name: 'Bold Astronaut Cow', model: 'https://modelviewer.dev/shared-assets/models/Astronaut.glb', color: '#ffffff', rarity: 'Rare'},
      {name: 'Graceful Flamingo Tiger', model: 'https://modelviewer.dev/shared-assets/models/Flamingo.glb', color: '#ff8c42', rarity: 'Rare'},
      {name: 'Vibrant Pink Flamingo', model: 'https://modelviewer.dev/shared-assets/models/Flamingo.glb', color: '#ff69b4', rarity: 'Epic'},
      {name: 'Timeless Nefertiti Wolf', model: 'https://modelviewer.dev/shared-assets/models/Nefertiti.glb', color: '#808080', rarity: 'Epic'},
      {name: 'Cosmic Astronaut Turtle', model: 'https://modelviewer.dev/shared-assets/models/Astronaut.glb', color: '#228b22', rarity: 'Epic'},
      {name: 'Stylish Flamingo Elephant', model: 'https://modelviewer.dev/shared-assets/models/Flamingo.glb', color: '#9370db', rarity: 'Epic'},
      {name: 'Golden Nefertiti Duck', model: 'https://modelviewer.dev/shared-assets/models/Nefertiti.glb', color: '#ffff00', rarity: 'Legendary'},
      {name: 'Adventurous Astronaut Bear', model: 'https://modelviewer.dev/shared-assets/models/Astronaut.glb', color: '#8b4513', rarity: 'Legendary'},
      {name: 'Dramatic Flamingo Panther', model: 'https://modelviewer.dev/shared-assets/models/Flamingo.glb', color: '#000000', rarity: 'Legendary'},
      {name: 'Exotic Nefertiti Parrot', model: 'https://modelviewer.dev/shared-assets/models/Nefertiti.glb', color: '#ff1493', rarity: 'Legendary'},
      {name: 'Arctic Astronaut Bear', model: 'https://modelviewer.dev/shared-assets/models/Astronaut.glb', color: '#f0f8ff', rarity: 'Legendary'},
      {name: 'Majestic Flamingo Lion', model: 'https://modelviewer.dev/shared-assets/models/Flamingo.glb', color: '#ffa500', rarity: 'Legendary'},
      {name: 'Deep Sea Nefertiti Whale', model: 'https://modelviewer.dev/shared-assets/models/Nefertiti.glb', color: '#4169e1', rarity: 'Legendary'},
      {name: 'Mythical Astronaut Dragon', model: 'https://modelviewer.dev/shared-assets/models/Astronaut.glb', color: '#ffd700', rarity: 'Legendary'}
    ];

    class Game {
      constructor() {
        this.level = 1; 
        this.score = 0; 
        this.streak = 0; 
        this.xp = 0; 
        this.maxXP = 100;
        this.isFrench = false; 
        this.targetWord = null; 
        this.words = words;
        this.unlockedAnimals = 0;
        this.init();
      }
      
      init() {
        this.loadModelViewer();
        this.bindEvents();
        this.updateStats();
        this.updateCollectionButton();
        this.newTarget();
      }

      loadModelViewer() {
        const script = document.createElement('script');
        script.src = 'https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js';
        script.type = 'module';
        document.head.appendChild(script);
      }
      
      bindEvents() {
        document.getElementById('new-game').addEventListener('click', () => {
          this.reset();
        });
        
        document.getElementById('flash-cards-btn').addEventListener('click', () => {
          this.renderCards();
        });

        document.getElementById('collection-btn').addEventListener('click', () => {
          this.showCollectionScreen();
        });
        
        document.getElementById('english-btn').addEventListener('click', () => {
          this.setLang('en');
        });
        
        document.getElementById('french-btn').addEventListener('click', () => {
          this.setLang('fr');
        });
        
        document.getElementById('speak-btn').addEventListener('click', () => {
          this.speak();
        });

        document.getElementById('continue-btn').addEventListener('click', () => {
          document.getElementById('level-up-modal').style.display = 'none';
          this.checkAnimalUnlock();
        });

        document.getElementById('unlock-screen').addEventListener('click', (e) => {
          if (e.target.id === 'unlock-screen') {
            document.getElementById('unlock-screen').style.display = 'none';
            this.newTarget();
          }
        });

        document.getElementById('animal-collection-screen').addEventListener('click', (e) => {
          if (e.target.id === 'animal-collection-screen') {
            document.getElementById('animal-collection-screen').style.display = 'none';
          }
        });
      }
      
      updateCollectionButton() {
        document.getElementById('collection-count').textContent = this.unlockedAnimals;
      }
      
      reset() {
        this.level = 1;
        this.score = 0;
        this.streak = 0;
        this.xp = 0;
        this.maxXP = 100;
        this.isFrench = false;
        this.unlockedAnimals = 0;
        document.getElementById('english-btn').classList.add('active');
        document.getElementById('french-btn').classList.remove('active');
        Object.keys(localStorage).forEach(key => {
          if (key.startsWith('animal_')) {
            localStorage.removeItem(key);
          }
        });
        this.updateStats();
        this.updateCollectionButton();
        this.newTarget();
      }
      
      setLang(lang) {
        this.isFrench = lang === 'fr';
        document.querySelectorAll('.language-btn').forEach(btn => btn.classList.remove('active'));
        document.getElementById(lang === 'fr' ? 'french-btn' : 'english-btn').classList.add('active');
        this.newTarget();
      }
      
      newTarget() {
        this.wordsList = this.isFrench ? this.words.fr : this.words.en;
        const randomIndex = Math.floor(Math.random() * this.wordsList.length);
        this.targetWord = this.wordsList[randomIndex];
        document.getElementById('word-prompt').textContent = `Listen for: ${this.targetWord.word.toUpperCase()}`;
        this.speak();
        this.renderCards();
      }
      
      speak() {
        if (speechSynthesis.speaking) speechSynthesis.cancel();
        let msg = new SpeechSynthesisUtterance(this.targetWord.word);
        msg.lang = this.isFrench ? 'fr-CA' : 'en-US';
        msg.rate = 0.65; 
        msg.pitch = 1.3; 
        msg.volume = 1;
        speechSynthesis.speak(msg);
      }
      
      getAnimalForLevel() {
        const animalIndex = Math.floor((this.level - 1) / 5) + 1;
        return uniqueAnimals3D[animalIndex] || null;
      }
      
      renderCards() {
        const gameArea = document.getElementById('game-area');
        gameArea.innerHTML = '';
        
        let cards = [this.targetWord];
        let others = this.wordsList.filter(w => w.word !== this.targetWord.word);
        others = others.sort(() => Math.random() - 0.5).slice(0, 4);
        cards = cards.concat(others);
        
        for (let i = cards.length - 1; i > 0; i--) {
          const j = Math.floor(Math.random() * (i + 1));
          [cards[i], cards[j]] = [cards[j], cards[i]];
        }
        
        cards.forEach((wordData) => {
          const card = document.createElement('div');
          card.className = 'card';
          card.dataset.word = wordData.word;
          
          card.innerHTML = `
            <div class="particles" style="display: none;"></div>
            <div class="feedback"></div>
            <svg class="shape-svg" viewBox="0 0 200 200">
              <path d="${wordData.shape}" />
            </svg>
            <div class="card-word">${wordData.word.toUpperCase()}</div>
          `;
          
          card.addEventListener('click', (e) => this.onCardClick(e, wordData));
          gameArea.appendChild(card);
        });
      }
      
      onCardClick(e, clickedWord) {
        const card = e.currentTarget;
        const isCorrect = clickedWord.word === this.targetWord.word;
        
        document.querySelectorAll('.card').forEach(c => c.classList.remove('target-card'));
        
        if (isCorrect) {
          this.streak++;
          this.score += 100 * this.level;
          this.xp += 25 * this.level;
          card.classList.add('target-card');
          this.showFeedback(card, 'Great job!', 'correct');
          this.createParticles(card);
          
          if (this.xp >= this.maxXP) {
            setTimeout(() => this.levelUp(), 1500);
          } else {
            setTimeout(() => this.newTarget(), 1500);
          }
        } else {
          this.streak = 0;
          this.showFeedback(card, 'Try again!', 'wrong');
          card.classList.add('target-card');
        }
        
        this.updateStats();
      }
      
      showFeedback(card, text, type) {
        const feedback = card.querySelector('.feedback');
        feedback.textContent = text;
        feedback.className = `feedback ${type}`;
        setTimeout(() => {
          feedback.className = 'feedback';
          feedback.textContent = '';
        }, 1000);
      }
      
      createParticles(card) {
        const particlesContainer = card.querySelector('.particles');
        particlesContainer.style.display = 'block';
        for (let i = 0; i < 12; i++) {
          const particle = document.createElement('div');
          particle.className = 'particle';
          particle.style.left = Math.random() * 100 + '%';
          particle.style.top = Math.random() * 100 + '%';
          particle.style.animationDelay = Math.random() * 0.3 + 's';
          particlesContainer.appendChild(particle);
          setTimeout(() => particle.remove(), 1500);
        }
        setTimeout(() => {
          particlesContainer.style.display = 'none';
          particlesContainer.innerHTML = '';
        }, 1500);
      }
      
      updateStats() {
        document.getElementById('level').textContent = this.level;
        document.getElementById('score').textContent = this.score;
        document.getElementById('streak').textContent = this.streak;
        document.getElementById('xp').textContent = this.xp;
        document.getElementById('max-xp').textContent = this.maxXP;
      }
      
      levelUp() {
        this.level++;
        this.maxXP = Math.min(100 + (this.level - 1) * 50, 500);
        this.xp = 0;
        document.getElementById('new-level').textContent = this.level;
        document.getElementById('level-up-modal').style.display = 'flex';
        document.querySelector('.modal-progress-fill').style.width = '100%';
        this.updateStats();
      }

      checkAnimalUnlock() {
        const animal = this.getAnimalForLevel();
        if (animal && !localStorage.getItem(`animal_${animal.name}`)) {
          this.showUnlockScreen(animal);
        } else {
          this.newTarget();
        }
      }

      showUnlockScreen(animal) {
        localStorage.setItem(`animal_${animal.name}`, 'unlocked');
        this.unlockedAnimals++;
        this.updateCollectionButton();

        const unlockContent = document.getElementById('unlock-content');
        unlockContent.innerHTML = `
          <div class="unlock-title">NEW ANIMAL UNLOCKED!</div>
          <div class="unlock-message">CONGRATULATIONS!</div>
          <div class="rarity-display ${animal.rarity.toLowerCase()}">${animal.rarity}</div>
          <h2 style="font-family: 'Open Sans', 'Roboto', Arial, sans-serif !important; font-size: 2.5em; margin: 20px 0;">${animal.name}</h2>
          <div class="unlock-animal-container">
            <model-viewer src="${animal.model}" 
                          shadow-intensity="1" 
                          camera-controls 
                          auto-rotate 
                          ar 
                          style="width: 100%; height: 100%; --poster-color: ${animal.color}; border-radius: 25px;"
                          class="unlock-animal-model"
                          alt="${animal.name}">
            </model-viewer>
          </div>
          <p style="font-family: 'Open Sans', 'Roboto', Arial, sans-serif !important; font-size: 1.4em; margin: 30px 0;">Added to your collection!</p>
          <button id="continue-unlock-btn" class="unlock-btn">Continue Adventure</button>
        `;

        document.getElementById('continue-unlock-btn').addEventListener('click', () => {
          document.getElementById('unlock-screen').style.display = 'none';
          this.newTarget();
        });

        document.getElementById('unlock-screen').style.display = 'flex';
      }
      
      showCollectionScreen() {
        const collectionContent = document.getElementById('collection-content');
        collectionContent.innerHTML = `
          <h2 style="font-family: 'Open Sans', 'Roboto', Arial, sans-serif !important; font-size: 3em; margin-bottom: 20px;">Your Collection (${this.unlockedAnimals})</h2>
          <div class="collection-grid" id="collection-grid"></div>
          <button id="close-collection-btn" class="unlock-btn" style="margin-top: 30px;">Close Collection</button>
        `;

        const grid = document.getElementById('collection-grid');
        uniqueAnimals3D.slice(1).forEach((animal) => {
          if (animal) {
            const isUnlocked = localStorage.getItem(`animal_${animal.name}`) === 'unlocked';
            const card = document.createElement('div');
            card.className = `collection-card ${animal.rarity.toLowerCase()} ${isUnlocked ? '' : 'locked'}`;
            card.innerHTML = `
              <div style="font-family: 'Open Sans', 'Roboto', Arial, sans-serif !important; font-size: 1.1em; opacity: ${isUnlocked ? '1' : '0.6'};">${animal.rarity}</div>
              <div class="collection-animal-container">
                <model-viewer src="${animal.model}" 
                              shadow-intensity="1" 
                              camera-controls 
                              auto-rotate 
                              style="width: 100%; height: 100%; --poster-color: ${animal.color};"
                              class="collection-animal"
                              alt="${animal.name}">
                </model-viewer>
              </div>
              <div style="font-family: 'Open Sans', 'Roboto', Arial, sans-serif !important; font-size: 1.3em; font-weight: 700;">${animal.name}</div>
              <div style="font-family: 'Open Sans', 'Roboto', Arial, sans-serif !important; opacity: ${isUnlocked ? '1' : '0.4'}">${isUnlocked ? 'Unlocked' : 'Locked'}</div>
            `;
            grid.appendChild(card);
          }
        });

        document.getElementById('close-collection-btn').addEventListener('click', () => {
          document.getElementById('animal-collection-screen').style.display = 'none';
        });

        document.getElementById('animal-collection-screen').style.display = 'flex';
      }
    }
    
    const game = new Game();
  </script>
</body>
</html>
