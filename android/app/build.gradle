apply plugin: 'com.android.application'

// ---------------------------------------------------------------------------
// Versioning: versionCode starts at 130 (v0.130)
// ---------------------------------------------------------------------------
def dqVersionCode = project.hasProperty('dqVersionCode') ? project.property('dqVersionCode').toInteger() : 130
def dqVersionName = project.hasProperty('dqVersionName') ? project.property('dqVersionName') : "0.${dqVersionCode}"

// ---------------------------------------------------------------------------
// Signing: the DEV key that all existing installs were signed with.
// Backed up in ~/Documents/DyslexiQuest-signing (see README.txt there).
// Optional android/keystore.properties (git-ignored) can point elsewhere.
// ---------------------------------------------------------------------------
def keystoreProps = new Properties()
def keystorePropsFile = rootProject.file('keystore.properties')
if (keystorePropsFile.exists()) { keystorePropsFile.withInputStream { keystoreProps.load(it) } }
def devKeystore = file(keystoreProps.getProperty('storeFile',
        "${System.getProperty('user.home')}/Documents/DyslexiQuest-signing/dyslexiquest-dev.keystore"))

android {
    namespace "com.dyslexiquest.app"
    compileSdk rootProject.ext.compileSdkVersion
    buildFeatures {
        buildConfig true
    }
    signingConfigs {
        dev {
            storeFile devKeystore
            storePassword keystoreProps.getProperty('storePassword', 'android')
            keyAlias keystoreProps.getProperty('keyAlias', 'androiddebugkey')
            keyPassword keystoreProps.getProperty('keyPassword', 'android')
        }
    }
    defaultConfig {
        applicationId "com.dyslexiquest.app"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode dqVersionCode
        versionName dqVersionName
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        // Where the in-app updater looks for the latest release manifest.
        buildConfigField "String", "UPDATE_MANIFEST_URL",
                "\"https://github.com/ianconnell128-hue/DyslexiQuest/releases/latest/download/latest.json\""
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    buildTypes {
        debug {
            signingConfig devKeystore.exists() ? signingConfigs.dev : signingConfigs.debug
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            signingConfig devKeystore.exists() ? signingConfigs.dev : signingConfigs.debug
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    constraints {
        implementation("org.jetbrains.kotlin:kotlin-stdlib-jdk7:1.8.22") {
            because("kotlin-stdlib-jdk7 is now a part of kotlin-stdlib")
        }
        implementation("org.jetbrains.kotlin:kotlin-stdlib-jdk8:1.8.22") {
            because("kotlin-stdlib-jdk8 is now a part of kotlin-stdlib")
        }
    }
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
